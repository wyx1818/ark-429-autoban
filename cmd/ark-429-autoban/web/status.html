<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{.Plugin}}</title>
  <link rel="stylesheet" href="status.css">
  <script defer src="status.js"></script>
</head>
<body>
  <h1>ARK 429 Autoban <span class="version">v{{.Version}}</span></h1>
  <div class="summary" id="summary">Management key required to view bans.</div>
  <div id="auth-notice" class="notice" hidden></div>
  <div class="key-row">
    <input id="mgmt-key" type="password" autocomplete="current-password" placeholder="Management key" aria-label="Management key">
    <button id="save-key-btn" type="button">Save Key</button>
  </div>
  <div class="actions">
    <button id="refresh-btn" type="button">Refresh</button>
    <button id="unban-all-btn" class="danger" type="button">Unban All</button>
    <button id="reload-btn" class="right" type="button">Reload Config</button>
  </div>
  <div class="table-wrap">
    <table>
      <thead><tr><th class="sortable" data-sort="auth">Auth ID<span class="sort-ind"><span class="sort-asc">▲</span><span class="sort-desc">▼</span></span></th><th>Key</th><th>Window</th><th class="sortable" data-sort="reset">Reset At<span class="sort-ind"><span class="sort-asc">▲</span><span class="sort-desc">▼</span></span></th><th class="sortable" data-sort="remaining">Remaining<span class="sort-ind"><span class="sort-asc">▲</span><span class="sort-desc">▼</span></span></th><th>Action</th></tr></thead>
      <tbody id="ban-tbody">
        <tr><td colspan="6" class="empty">Management key required to view active bans.</td></tr>
      </tbody>
    </table>
  </div>
</body>
</html>
